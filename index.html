<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>PRL Space Miner</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dark-mode"> <!-- Default Dark Mode to match Space concept -->

    <!-- 마이닝 존 -->
    <div id="mining-zone">
        <div id="scoreboard">
            <div id="score-display">0</div>
            <div id="sps-display">0 Minerals / sec</div>
        </div>
        <div id="asteroid-container">
            <div id="asteroid"></div>
        </div>
    </div>

    <!-- 상점 존 -->
    <div id="shop-zone">
        <div class="shop-header">UPGRADES</div>
        <div id="shop-list"></div>

        <!-- 초기화 버튼 추가 -->
        <div style="margin-top: 20px; text-align: center;">
            <button onclick="resetGame()"
                style="background:none; border:1px solid #ff4444; color:#ff4444; padding:5px 10px; border-radius:5px; cursor:pointer;">데이터
                초기화</button>
        </div>

        <!-- 버전 표시 (HTML 위치 이동) -->
        <div id="version-display" onclick="openModal()">v0.1.0.3</div>
    </div>

    <!-- 패치노트 모달 -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div id="modal-content">
            <h2>PATCH NOTES</h2>
            <div id="patch-list"></div>
            <div style="text-align: right; margin-top: 15px;">
                <button onclick="document.getElementById('modal-overlay').style.display='none'"
                    style="background:var(--accent-color); border:none; padding:5px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Close</button>
            </div>
        </div>
    </div>

    <!-- Script 연결 (순서 중요! data -> main) -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>

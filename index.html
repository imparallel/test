<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>PRL Space Miner</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dark-mode"> <!-- Default Dark Mode to match Space concept -->

    <!-- 마이닝 존 -->
    <div id="mining-zone">
        <div id="scoreboard">
            <div id="score-display">0</div>
            <div id="sps-display">0 Minerals / sec</div>
        </div>
        <div id="asteroid-container">
            <div id="asteroid"></div>
        </div>
    </div>

    <!-- 오른쪽 상점 구역 -->
    <div id="shop-zone">
        <div class="shop-header">UPGRADES</div>

        <!-- 코어 과부하 버튼 -->
        <div style="margin-bottom: 20px; text-align: center;">
            <button onclick="upgradeCore()"
                style="width:100%; padding:15px; background:linear-gradient(45deg, #ff0055, #ff4444); border:none; border-radius:10px; color:white; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); transition: transform 0.1s;">
                ⚡ 코어 과부하 (RISK)
            </button>
            <div style="font-size:0.75rem; color:#aaa; margin-top:5px;">성공 시 채굴 효율 +20% / 실패 시 초기화</div>
        </div>

        <!-- 아이템 목록이 JS로 생성됨 -->
        <div id="shop-list"></div>

        <!-- 초기화 버튼 추가 -->
        <div style="margin-top: 20px; text-align: center;">
            <button onclick="resetGame()"
                style="background:none; border:1px solid #ff4444; color:#ff4444; padding:5px 10px; border-radius:5px; cursor:pointer;">데이터
                초기화</button>
        </div>

        <!-- 버전 표시 (HTML 위치 이동) -->
        <div id="version-display" onclick="openModal()">v0.1.1.0</div>
    </div>

    <!-- 패치노트 모달 -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div id="modal-content">
            <h2>PATCH NOTES</h2>
            <div id="patch-list"></div>
            <div style="text-align: right; margin-top: 15px;">
                <button onclick="document.getElementById('modal-overlay').style.display='none'"
                    style="background:var(--accent-color); border:none; padding:5px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Close</button>
            </div>
        </div>
    </div>

    <!-- Script 연결 (순서 중요! data -> main) -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

    <!-- Script 연결 (순서 중요! data -> main) -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
